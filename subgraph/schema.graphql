# schema.graphql
type CreateNewMarket @entity(immutable: true) {
  id: Bytes!
  market: Bytes! # address
  PT: Bytes! # address
  scalarRoot: BigInt! # int256
  initialAnchor: BigInt! # int256
  lnFeeRateRoot: BigInt! # uint256
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type Initialized @entity(immutable: true) {
  id: Bytes!
  version: Int! # uint8
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type NewTreasuryAndFeeReserve @entity(immutable: true) {
  id: Bytes!
  treasury: Bytes! # address
  reserveFeePercent: Int! # uint8
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type OwnershipTransferred @entity(immutable: true) {
  id: Bytes!
  previousOwner: Bytes! # address
  newOwner: Bytes! # address
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type SetOverriddenFee @entity(immutable: true) {
  id: Bytes!
  router: Bytes! # address
  market: Bytes! # address
  lnFeeRateRoot: BigInt! # uint80
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type Market @entity {
  id: Bytes!
  address: Bytes!
  principalToken: Bytes!
  standardizedYield: Bytes
  yieldToken: Bytes 
  createdAt: BigInt!
  creationTx: Bytes!
  redeemRewards: [RedeemRewards!]! @derivedFrom(field: "market")
  ytSwaps: [YTSwap!]! @derivedFrom(field: "market")
  ytStats: MarketYTStats
}

type RedeemRewardToken @entity {
  id: Bytes!
  redeemEvent: RedeemRewards!
  token: Bytes!  # The reward token address
  amount: BigInt!  # The amount redeemed
}

type RedeemRewards @entity {
  id: Bytes!
  user: Bytes!
  market: Market!
  rewards: [RedeemRewardToken!]! @derivedFrom(field: "redeemEvent")
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type MarketReward @entity {
  id: ID!
  market: Bytes!
  amount: BigInt!
  timestamp: BigInt!
  blockNumber: BigInt!
}

type RewardUpdate @entity {
  id: ID!
  market: Bytes!
  pendlePerSec: BigInt!
  incentiveEndsAt: BigInt!
  timestamp: BigInt!
  blockNumber: BigInt!
}

type YTSwap @entity {
  id: Bytes!
  ytToken: Bytes!
  caller: Bytes!
  market: Market!
  receiver: Bytes!
  netYtToAccount: BigInt!
  netSyOrTokenToAccount: BigInt!
  isToken: Boolean!
  tokenAddress: Bytes
  netSyIntermediate: BigInt
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# YT Yield Claim
type YTYieldClaim @entity {
  id: Bytes!
  ytToken: Bytes!
  user: Bytes!
  market: Market
  amount: BigInt!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# User YT Balance
type UserYTBalance @entity {
  id: Bytes! # user-ytToken
  user: Bytes!
  ytToken: Bytes!
  market: Market
  balance: BigInt!
  lastUpdated: BigInt!
}

type MarketYTStats @entity {
  id: Bytes! # market address
  market: Market!
  totalYTClaimed: BigInt!
  totalYTHolders: BigInt!
  lastUpdated: BigInt!
}
